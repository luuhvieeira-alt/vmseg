
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VM SEGUROS - CLOUD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f1a;
            color: #f3f4f6;
            margin: 0;
            padding: 0;
        }
        
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        .scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: #0f172a; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        @keyframes piscaSuave {
            0% { opacity: 1; color: #10b981; }
            50% { opacity: 0.2; color: #064e3b; }
            100% { opacity: 1; color: #10b981; }
        }
        .s-suhai-pulse { 
            animation: piscaSuave 2.5s infinite; 
            font-weight: 900; 
        }

        .kanban-column {
            min-width: 280px;
            flex-shrink: 0;
        }

        /* Estilos para PDF / Impressão */
        @media print {
            aside, header, button, .no-print, input, select {
                display: none !important;
            }
            body {
                background-color: white !important;
                color: black !important;
            }
            main {
                padding: 0 !important;
                margin: 0 !important;
            }
            .bg-[#111827], .bg-[#0b0f1a] {
                background-color: white !important;
                border: 1px solid #e5e7eb !important;
            }
            .text-white, .text-gray-400, .text-gray-500, .text-blue-400 {
                color: black !important;
            }
            .text-green-500 {
                color: #059669 !important;
            }
            table {
                width: 100% !important;
                border-collapse: collapse !important;
            }
            th, td {
                border: 1px solid #ddd !important;
                padding: 8px !important;
                color: black !important;
            }
            .rounded-[2.5rem], .rounded-[3rem], .rounded-2xl {
                border-radius: 0 !important;
            }
        }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "@google/genai": "https://esm.sh/@google/genai@1.37.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
<body class="scrollbar-thin">
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
</body>
</html>
