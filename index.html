
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VM SEGUROS - CLOUD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f1a;
            color: #f3f4f6;
            margin: 0;
            padding: 0;
        }
        
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        .scrollbar-thin::-webkit-scrollbar { width: 6px; height: 6px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: #0f172a; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        @keyframes piscaSuave {
            0% { opacity: 1; color: #10b981; }
            50% { opacity: 0.2; color: #064e3b; }
            100% { opacity: 1; color: #10b981; }
        }
        .s-suhai-pulse { 
            animation: piscaSuave 2.5s infinite; 
            font-weight: 900; 
        }

        .kanban-column {
            min-width: 280px;
            flex-shrink: 0;
        }

        /* Estilos para PDF / Impressão */
        @media print {
            /* Ocultar elementos desnecessários */
            aside, header, button, .no-print, input, select, .fas, .fa-robot {
                display: none !important;
            }

            /* Resetar containers para permitir rolagem e expansão total no PDF */
            html, body, #root, div[class*="flex-col"], main {
                height: auto !important;
                overflow: visible !important;
                display: block !important;
                background-color: white !important;
                color: black !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            /* Forçar containers específicos do Layout a não limitarem altura */
            .h-screen, .overflow-hidden, .overflow-y-auto {
                height: auto !important;
                overflow: visible !important;
                max-height: none !important;
                position: relative !important;
            }

            /* Estilo da Tabela para Impressão */
            table {
                width: 100% !important;
                border-collapse: collapse !important;
                table-layout: auto !important;
                page-break-inside: auto;
            }
            tr {
                page-break-inside: avoid;
                page-break-after: auto;
            }
            thead {
                display: table-header-group;
            }
            th, td {
                border: 1px solid #e5e7eb !important;
                padding: 12px 8px !important;
                color: black !important;
                background: white !important;
                word-wrap: break-word !important;
            }

            /* Ajuste de cores para economia de tinta e clareza */
            .text-white, .text-gray-400, .text-gray-500, .text-blue-400 {
                color: black !important;
            }
            .text-green-500 {
                color: #059669 !important; /* Verde escuro para leitura */
            }
            .bg-[#111827], .bg-[#0b0f1a], .bg-[#0b0f1a]/50 {
                background-color: white !important;
                border: 1px solid #e5e7eb !important;
            }

            /* Remover arredondamentos exagerados que podem bugar em PDF */
            .rounded-[2.5rem], .rounded-[3rem], .rounded-2xl, .rounded-[2rem] {
                border-radius: 4px !important;
            }
            
            /* Título do Relatório */
            #financeiro-table::before {
                content: "RELATÓRIO DE PRODUÇÃO - VM SEGUROS";
                display: block;
                font-weight: 900;
                font-size: 18px;
                text-align: center;
                margin-bottom: 20px;
                text-transform: uppercase;
            }
        }
    </style>

{
  "imports": {

    "@google/genai": "https://esm.sh/@google/genai@1.37.0",

    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>

</body>
</html>
